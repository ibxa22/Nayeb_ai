<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="نايب: طبقة الذكاء الاصطناعي لإدارة ومتابعة المشتريات">
<title>Nayeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@300;400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout = a story: hero promise + one-purchase journey strip → why (the problem) → the story of one purchase in 6 chapters (today vs. with Nayeb) → what changes per team → why it's safe + CTA → full module reference at the end */
:root{
  --bg:#FBF9F1; --surface:#FFFFFF; --sand:#F4F0E3; --ink:#1B2422; --muted:#5E6A66; --line:#E6E2D4;
  --teal:#00A99D; --teal-ink:#00786F; --teal-soft:#DCF1EE; --on-teal:#FFFFFF;
  --olive:#69895D; --olive-ink:#4E6B44; --olive-soft:#E7EDE1;
  --dune-a:#CFEAE5; --dune-b:#DCE6D2; --dune-c:#EFE9D8;
  --logo-stroke:#333333;
  --risk:#B8412C; --risk-soft:#FAE8E3; --warn:#9A6400; --warn-soft:#F8EDD5; --ok:#2E7A4C; --ok-soft:#E1F1E6;
  --shadow:0 1px 2px rgba(27,36,34,.04),0 24px 48px -24px rgba(27,36,34,.28);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#161F1D; --sand:#131C1A; --ink:#E9EEEB; --muted:#9DABA6; --line:#26332F;
  --teal:#18B8AC; --teal-ink:#5AD3C8; --teal-soft:#0F302C; --on-teal:#06201D;
  --olive:#8EAF80; --olive-ink:#A9C79C; --olive-soft:#1C2A1B;
  --dune-a:#123632; --dune-b:#1E2E1C; --dune-c:#1A2220;
  --logo-stroke:#0F1614;
  --risk:#F08A74; --risk-soft:#3A1C16; --warn:#E3B24E; --warn-soft:#33280F; --ok:#6CC28E; --ok-soft:#12291C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 24px 48px -24px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#161F1D; --sand:#131C1A; --ink:#E9EEEB; --muted:#9DABA6; --line:#26332F;
  --teal:#18B8AC; --teal-ink:#5AD3C8; --teal-soft:#0F302C; --on-teal:#06201D;
  --olive:#8EAF80; --olive-ink:#A9C79C; --olive-soft:#1C2A1B;
  --dune-a:#123632; --dune-b:#1E2E1C; --dune-c:#1A2220;
  --logo-stroke:#0F1614;
  --risk:#F08A74; --risk-soft:#3A1C16; --warn:#E3B24E; --warn-soft:#33280F; --ok:#6CC28E; --ok-soft:#12291C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 24px 48px -24px rgba(0,0,0,.7); color-scheme:dark;
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{line-height:1.8}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;color:var(--ink);font-weight:500}
.label{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--teal-ink)}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
.lead{color:var(--muted);font-size:18px;max-width:60ch}
bdi{unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:21px;color:var(--ink);text-decoration:none}
.brand small{font-weight:400;font-size:13px;color:var(--muted);font-family:var(--font-body)}
.navlink{color:var(--muted);text-decoration:none;font-size:15px}
.navlink:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:500;font-size:15px;padding:12px 22px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s;font-family:inherit}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-dark:hover{background:var(--teal-ink)}
.btn-light{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-light:hover{border-color:var(--teal)}
.btn-sm{padding:8px 16px;font-size:14px}
.lang-btn{min-width:84px}
.flip{display:inline-block}
[dir="rtl"] .flip{transform:scaleX(-1)}
@media (prefers-reduced-motion: reduce){.btn:hover{transform:none}}

/* hero */
.hero{padding-block:56px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--teal-ink);font-weight:500}
.hero h1{font-size:clamp(34px,6vw,66px);line-height:1.08;letter-spacing:-.03em;max-width:18ch}
html[lang="ar"] .hero h1{line-height:1.35;letter-spacing:0}
.hero h1 .accent{color:var(--teal)}
.hero .lead{margin-inline:auto}
/* hero with savings calculator */
.hero-text{display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0}
.hero-calc{width:100%;display:flex;justify-content:center;min-width:0}
@media (min-width:1000px){
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,400px);align-items:center;gap:56px;text-align:start;padding-block:64px 36px}
  .hero-text{align-items:flex-start}
  .hero-text .lead{margin-inline:0}
  .hero-text > .flex{justify-content:flex-start}
  .hero h1{font-size:clamp(40px,4.6vw,60px)}
}
/* Nayeb savings calculator */
.nayeb-calc{
  --nc-teal-strong:var(--teal-ink);
  width:100%;max-width:400px;margin:0 auto;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:22px;padding:22px 18px 16px;display:flex;flex-direction:column;gap:12px;
  font-size:15px;line-height:1.5;text-align:start;box-shadow:0 24px 60px -28px rgba(27,36,34,.35)}
.nayeb-calc *{box-sizing:border-box}
.nc-tag{margin:0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:1.2rem;line-height:1.4}
.nc-tag span{color:var(--teal-ink)}
.nc-sub{margin:-6px 0 4px;text-align:center;color:var(--muted);font-size:.92rem}
.nc-field{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:500}
.nc-box{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 9px}
.nc-box:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.nc-box input{width:64px;border:0;background:transparent;color:var(--ink);font:600 1rem var(--font-display);font-variant-numeric:tabular-nums;text-align:center;direction:ltr;outline:none;padding:0}
.nc-box input{-moz-appearance:textfield;appearance:textfield}
.nc-box input::-webkit-inner-spin-button,.nc-box input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nc-box input::placeholder{color:var(--muted);opacity:.55;font-weight:400}
.nc-unit{color:var(--muted);font-size:.76rem;white-space:nowrap;min-width:52px}
.nc-out{margin-top:4px;background:#1B2422;color:#FBF9F1;border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.nc-big-k{font-size:.85rem;font-weight:600;opacity:.85}
.nc-big{font:700 2.2rem/1.2 var(--font-display);color:#2BC2B6;font-variant-numeric:tabular-nums}
.nc-out > small{font-size:.78rem;opacity:.7}
.nc-split{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #34413E}
.nc-split > div{display:flex;flex-direction:column;gap:1px;min-width:0}
.nc-split span{font-size:.74rem;opacity:.75}
.nc-split b{font:600 1.05rem var(--font-display);font-variant-numeric:tabular-nums}
.nc-split small{font-size:.7rem;opacity:.7;line-height:1.35}
.nc-cta{display:block;text-align:center;background:var(--teal);color:#fff;text-decoration:none;font:600 1rem var(--font-display);padding:11px;border-radius:11px}
.nc-cta:hover{background:#00968B}
.nc-note{margin:-4px 0 0;text-align:center;font-size:.7rem;color:var(--muted)}
.nayeb-calc :focus-visible{outline:2px solid var(--teal);outline-offset:2px}


/* journey strip */
.dunes{position:relative;border-radius:32px;overflow:hidden;padding:36px 20px 44px;background:
  radial-gradient(70% 90% at 10% 0%,var(--dune-a),transparent 70%),
  radial-gradient(60% 80% at 100% 20%,var(--dune-b),transparent 70%),var(--sand)}
.dunes svg.waves{position:absolute;inset-inline:0;bottom:0;width:100%;height:55%;pointer-events:none}
.journey-t{position:relative;text-align:center;font-family:var(--font-display);font-size:17px;margin-bottom:20px}
.journey{position:relative;list-style:none;margin:0 auto;padding:0;max-width:1100px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.journey{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1000px){.journey{grid-template-columns:repeat(7,1fr)}}
.journey a{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 10px;box-shadow:var(--shadow);transition:border-color .2s,transform .2s;height:100%}
.journey a:hover{border-color:var(--teal);transform:translateY(-2px)}
.journey .jn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink)}
.journey li:last-child .jn{background:var(--olive-soft);color:var(--olive-ink)}
.journey b{font-family:var(--font-display);font-weight:500;font-size:15px;line-height:1.3}
.journey small{font-size:12px;color:var(--muted);line-height:1.4}
.strip{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px 0;text-align:center}
.strip p{font-size:14px;color:var(--muted)}
.strip ul{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 30px;list-style:none;margin:0;padding:0}
.strip li{font-family:var(--font-display);font-size:18px;font-weight:500;color:color-mix(in srgb,var(--ink) 55%,var(--bg))}

/* sections */
section{scroll-margin-top:70px}
.sec{padding-block:80px}
.sec-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:40px}
.sec-head h2{font-size:clamp(28px,4vw,46px);line-height:1.12;letter-spacing:-.025em;max-width:22ch}
html[lang="ar"] .sec-head h2{line-height:1.4;letter-spacing:0}
.sec-head .lead{margin-inline:auto}
.band{background:var(--surface);border-block:1px solid var(--line)}

/* why */
.why{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.why{grid-template-columns:repeat(3,1fr)}}
.why article{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:10px}
.why .wi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--risk-soft);color:var(--risk)}
.why h3{font-size:21px;line-height:1.3}
.why p{color:var(--muted);font-size:15px}

/* story */
.persona{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;margin:-16px auto 40px;max-width:720px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 20px}
.persona .av{width:40px;height:40px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;flex:none}
.persona p{font-size:15px;min-width:0}
.persona small{display:block;font-size:12px;color:var(--muted)}
.chapters{display:grid;gap:22px;position:relative}
.ch{display:grid;gap:18px;grid-template-columns:1fr;scroll-margin-top:90px;background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:22px}
@media (min-width:900px){.ch{padding:28px}}
@media (min-width:900px){.ch{grid-template-columns:230px 1fr}}
.ch-side{display:flex;gap:14px;align-items:flex-start}
@media (min-width:900px){.ch-side{flex-direction:column;gap:10px}}
.ch-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink);flex:none}
.ch-ic.olive{background:var(--olive-soft);color:var(--olive-ink)}
.ch-side .q{font-size:15px;line-height:1.55;margin-top:4px}
.ch-side .who{margin-top:6px}
.ch-side h3{font-size:22px;line-height:1.25}
.ch-side .who{font-size:13px;color:var(--muted)}
.mpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--teal-soft);color:var(--teal-ink);border-radius:999px;padding:3px 10px;margin-top:4px;text-decoration:none}
.mpill.olive{background:var(--olive-soft);color:var(--olive-ink)}
.ch-body{display:grid;gap:12px;grid-template-columns:1fr;min-width:0}
@media (min-width:700px){.ch-body{grid-template-columns:1fr 1.25fr}}
.today,.with{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.today{background:var(--surface);border:1px dashed var(--line)}
.with{background:var(--surface);border:1px solid var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;width:fit-content}
.today .tag{color:var(--risk)}
.with .tag{color:var(--teal-ink)}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor}
.today p{color:var(--muted);font-size:15px}
.with p{font-size:15px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--sand);border-radius:14px;padding:10px 12px;font-size:13px}
.alert .sev{width:9px;height:9px;border-radius:50%;margin-top:6px}
.sev.risk{background:var(--risk)} .sev.warn{background:var(--warn)} .sev.ok{background:var(--ok)} .sev.olive{background:var(--olive)}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feats span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);background:var(--bg)}
.story-note{text-align:center;font-size:13px;color:var(--muted);margin-top:28px}
.result{margin-top:34px;background:var(--ink);color:var(--bg);border-radius:28px;padding:28px;display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:860px){.result{grid-template-columns:1.1fr 2fr;align-items:center;padding:36px}}
.result h3{color:var(--bg);font-size:26px;line-height:1.3}
.result ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:600px){.result ul{grid-template-columns:1fr 1fr}}
.result li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:color-mix(in srgb,var(--bg) 85%,var(--ink))}
.result svg{flex:none;margin-top:4px;color:var(--teal)}


/* built-in AI */
.aigrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.aigrid{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.aigrid{grid-template-columns:repeat(4,1fr)}}
.aic{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px}
.aic .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink)}
.aic h3{font-size:17px;line-height:1.35}
.aic p{font-size:14px;color:var(--muted);line-height:1.6}

/* teams */
.teams{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.teams{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.teams{grid-template-columns:repeat(5,1fr)}}
.team{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.team .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink)}
.team h3{font-size:17px;line-height:1.35}
.team p{font-size:15px;line-height:1.55}
.team small{margin-top:auto;font-size:12px;font-weight:600;color:var(--teal-ink)}

/* feature picker inside each chapter */
.pick{display:grid;gap:8px}
.pick-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pick-h .mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.mode.auto{background:var(--teal-soft);color:var(--teal-ink)}
.mode.demand{background:var(--sand);color:var(--muted);border:1px solid var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:inherit;font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:start;transition:border-color .2s,background .2s,color .2s}
.fchip:hover{border-color:var(--teal)}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.fchip .soon-pill{display:inline-block;font-size:10px;font-weight:600;background:var(--olive-soft);color:var(--olive-ink);border-radius:999px;padding:0 6px;margin-inline-start:6px;vertical-align:1px}
.fchip.ov{border-style:dashed}
.with h4{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.4;color:var(--teal-ink)}
.soon-note{font-size:12px;font-weight:600;color:var(--olive-ink);background:var(--olive-soft);border-radius:999px;padding:2px 10px;width:fit-content}
.ch-body{grid-template-columns:1fr !important}
.cards2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.cards2{grid-template-columns:1fr 1.25fr}}
.pick-hint{text-align:center;font-size:14px;color:var(--teal-ink);font-weight:500;margin:-24px auto 32px}

/* cta */
.cta{background:var(--ink);color:var(--bg);border-radius:32px;padding:40px 24px;display:grid;gap:26px}
@media (min-width:900px){.cta{grid-template-columns:1fr 1.1fr;padding:52px}}
.cta h2{color:var(--bg);font-size:clamp(28px,3.6vw,42px);line-height:1.2;letter-spacing:-.02em}
html[lang="ar"] .cta h2{letter-spacing:0;line-height:1.4}
.cta p{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.cta hr{grid-column:1/-1;border:0;border-top:1px solid color-mix(in srgb,var(--bg) 16%,var(--ink));margin:0}
.trust{grid-column:1/-1;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.trust{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.trust{grid-template-columns:repeat(3,1fr)}}
.trust div{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:color-mix(in srgb,var(--bg) 80%,var(--ink))}
.trust b{display:block;color:var(--bg);font-weight:600}
.trust svg{flex:none;margin-top:3px;color:var(--teal)}
.form{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.form{grid-template-columns:1fr 1fr}}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--bg) 78%,var(--ink));min-width:0}
.form input,.form select{width:100%;min-width:0;background:color-mix(in srgb,var(--bg) 7%,var(--ink));border:1px solid color-mix(in srgb,var(--bg) 20%,var(--ink));color:var(--bg);border-radius:12px;padding:11px 12px;font:inherit;font-weight:400;font-size:15px}
.form .full{grid-column:1/-1}
.form .btn{background:var(--teal);color:var(--on-teal)}

@media (max-width:699px){
  .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-4px;padding-inline:4px;scroll-snap-type:x proximity}

}

.nc-field > span:first-child{flex:1;min-width:0}
.nc-unit{flex:1;min-width:0;text-align:start}

.mode{cursor:help}
.form input,.form select{box-sizing:border-box}
.fchip,.alert,.today,.with,.aic,.team,.why article,#journey a,#trust > div,#resultList li{overflow-wrap:break-word}

.journey,.why,.teams,.trust,.result ul{grid-auto-rows:1fr}
.journey li{display:flex}.journey a{flex:1}

.aigrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.aic{flex:0 0 100%;box-sizing:border-box;min-width:0}
.fchip,.ch,.team,.why article,.journey a{box-sizing:border-box}
@media (min-width:640px){.aic,.aic:first-child{flex:0 0 calc((100% - 14px)/2);grid-column:auto}}

.fchip{display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;padding:8px 12px;min-height:52px}

.ch-body{display:flex !important;flex-direction:column;gap:12px}
.cards2{flex:1;grid-template-columns:1fr}

.hero-text .btn,.cta .btn-light{min-width:200px}

/* ---------- savings calculator ---------- */
/* Assumptions behind the "up to" estimate: 13% of spend saved, 30% of follow-up time freed. */
const NC_SAVE_RATE = 0.13, NC_TIME_FREED = 0.30;
const NC = {
  ar:{tag:'المتابعة على نايب، <span>والقرار عليك.</span>', sub:"أدخل أرقامك، وشوف كم ممكن توفّر.",
    spendL:"كم تصرف على المشتريات في السنة؟", mSar:"مليون ريال",
    peopleL:"كم شخص يتابع المشتريات والفواتير؟", ppl:"شخص",
    costL:"كم يكلّفك الموظف بدوام كامل في السنة؟", kSar:"ألف ريال",
    bigK:"ممكن توفّر حتى", perYear:"في السنة", saveK:"من المشتريات", teamK:"من وقت الفريق",
    fte:n => "كأنك أضفت "+n+" موظف بدون توظيف", empty:"أدخل عدد فريقك وتكلفته",
    cta:"احجز عرض تجريبي", note:"* أرقام تقديرية للتوضيح. الرقم الحقيقي تقوله بياناتك."},
  en:{tag:'Nayeb does the follow-up. <span>Your team makes the calls.</span>', sub:"Add your numbers and see what comes back.",
    spendL:"Yearly procurement spend?", mSar:"million SAR",
    peopleL:"People following up purchases and invoices?", ppl:"people",
    costL:"Yearly cost of one full-time employee?", kSar:"thousand SAR",
    bigK:"You could save up to", perYear:"per year", saveK:"From procurement", teamK:"From team time",
    fte:n => "Like adding "+n+" people, without hiring", empty:"Add your team size and cost",
    cta:"Request a demo", note:"* Illustrative estimate. Your own data gives the real number."}
};
const ncTrim = x => String(+x);
const ncNum = el => { const v = parseFloat(el.value); return isNaN(v) || v <= 0 ? 0 : v; };
function ncMoney(n){
  const big = n >= 1e6, x = big ? ncTrim((n/1e6).toFixed(n >= 1e8 ? 0 : n >= 1e7 ? 1 : 2)) : ncTrim(Math.round(n/1e3));
  return lang === "ar" ? x + " " + (big ? "مليون" : "ألف") + " ريال" : "SAR " + x + (big ? "M" : "K");
}
function ncRender(){
  const r = $("#ncalc"), q = s => r.querySelector(s), tx = NC[lang];
  const spend = ncNum(q(".nc-spend"))*1e6, people = ncNum(q(".nc-people")), cost = ncNum(q(".nc-cost"))*1e3;
  const sv = spend*NC_SAVE_RATE, tm = (people && cost) ? people*cost*NC_TIME_FREED : 0;
  q(".nc-big").textContent = (sv+tm) ? ncMoney(sv+tm) : "—";
  q(".nc-save-v").textContent = spend ? ncMoney(sv) : "—";
  if (people && cost){
    q(".nc-team-v").textContent = ncMoney(tm);
    q(".nc-team-s").textContent = tx.fte(ncTrim((people*NC_TIME_FREED).toFixed(1)));
  } else {
    q(".nc-team-v").textContent = "—";
    q(".nc-team-s").textContent = tx.empty;
  }
}
function ncLang(){
  const r = $("#ncalc"), tx = NC[lang];
  r.querySelectorAll("[data-nc]").forEach(el => { el.textContent = tx[el.dataset.nc]; });
  r.querySelectorAll("[data-nc-html]").forEach(el => { el.innerHTML = tx[el.dataset.ncHtml]; });
  ncRender();
}
document.querySelectorAll("#ncalc input").forEach(el => el.addEventListener("input", ncRender));

const $ = s => document.querySelector(s);
const t = k => (I[k] ? I[k][lang] : k);

function chapterBody(c, i){
  const chips = c.feats.map((x,j) => `<button class="fchip" type="button" data-ch="${i}" data-f="${j}" aria-pressed="${sel[i]===j}">${L(x.name)}</button>`).join("");
  const hid = j => sel[i]===j ? "" : ' aria-hidden="true"';
  return `
    <div class="pick">
      <div class="pick-h"><span class="mode ${c.mode}" title="${t(c.mode + "_t")}">${t(c.mode)}</span><span>${fcount(c.feats.length)}</span></div>
      <div class="fchips" role="group" aria-label="${L(c.mname)}">${chips}</div>
    </div>
    <div class="cards2" aria-live="polite">
      <div class="today"><span class="tag"><i></i>${t("today")}</span>
        <div class="stack">${c.feats.map((f,j) => `<div${hid(j)}><p>${L(f.today)}</p></div>`).join("")}</div>
      </div>
      <div class="with"><span class="tag"><i></i>${t("withn")}</span>
        <div class="stack">${c.feats.map((f,j) => `<div${hid(j)}><h4>${L(f.name)}</h4><p>${L(f.with)}</p>
          <div class="alert"><span class="sev ${f.alert.sev}"></span><span>${f.alert[lang]}</span></div></div>`).join("")}</div>
      </div>
    </div>`;
}

/* every item in a group gets the height of the tallest one */
const EQ = ["#journey a", ".why article", ".fchip", ".ch", ".aic", ".team", "#trust > div", "#resultList li"];
function equalize(){
  EQ.forEach(q => document.querySelectorAll(q).forEach(el => { el.style.minHeight = ""; }));
  EQ.forEach(q => {
    const els = [...document.querySelectorAll(q)];
    const h = Math.max(0, ...els.map(el => el.getBoundingClientRect().height));
    els.forEach(el => { el.style.minHeight = h + "px"; });
  });
}
let eqT;
addEventListener("resize", () => { clearTimeout(eqT); eqT = setTimeout(equalize, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(equalize);
addEventListener("load", equalize);

function renderChapters(){
  $("#chapters").innerHTML = CH.map((c,i) => `<article class="ch" id="ch-${i+1}">
      <div class="ch-side">
        <span class="ch-ic${c.olive ? " olive" : ""}">${svg(P[c.m],22)}</span>
        <div><h3>${L(c.mname)}</h3><p class="q">${L(Q[c.m])}</p><p class="who">${L(c.who)}</p></div>
      </div>
      <div class="ch-body" id="chb-${i}">${chapterBody(c,i)}</div>
    </article>`).join("");
}

function render(){
  $("#heroTitle").innerHTML = HERO[lang];
  $("#stripList").innerHTML = STRIP[lang].map(s => `<li>${s}</li>`).join("");
  $("#avatar").textContent = lang === "ar" ? "أ" : "A";
  $("#journey").innerHTML = CH.map((c,i) => `<li><a href="#ch-${i+1}"><span class="jn">${svg(P[c.m],20)}</span><b>${L(c.mname)}</b><small>${fcount(c.feats.length)}</small></a></li>`).join("");
  $("#whyCards").innerHTML = WHY.map(w => `<article><span class="wi">${svg(P[w.i])}</span><h3>${L(w.t)}</h3><p>${L(w.d)}</p></article>`).join("");
  renderChapters();
  $("#resultList").innerHTML = RESULT[lang].map(r => `<li>${svg(P.ok,18)}<span>${r}</span></li>`).join("");
  $("#aiGrid").innerHTML = AI.map(x => `<article class="aic"><span class="ti">${svg(x.i)}</span><h3>${L(x.t)}</h3><p>${L(x.d)}</p></article>`).join("");
  $("#teamGrid").innerHTML = TEAMS.map(x => `<article class="team"><span class="ti">${svg(P[x.i])}</span><h3>${L(x.t)}</h3><p>${L(x.d)}</p><small>${L(x.m)}</small></article>`).join("");
  $("#trust").innerHTML = TRUST.map(x => `<div>${svg(x.i,20)}<span><b>${L(x.t)}</b>${L(x.d)}</span></div>`).join("");
  const rs = $("#fRole"), idx = rs.selectedIndex;
  rs.innerHTML = `<option value="" disabled>${t("fm_role_ph")}</option>` + ROLES[lang].map(r => `<option>${r}</option>`).join("");
  rs.selectedIndex = idx > 0 ? idx : 0;
  const e = $("#fErp"), ei = e.selectedIndex;
  e.innerHTML = ERPS.map(x => `<option>${x}</option>`).join("") + `<option>${t("erp_other")}</option>`;
  e.selectedIndex = ei > -1 ? ei : 0;
}

function applyLang(){
  const html = document.documentElement;
  html.lang = lang; html.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (I[k]) el.textContent = I[k][lang]; });
  const b = $("#langBtn");
  b.textContent = lang === "ar" ? "English" : "العربية";
  b.setAttribute("aria-label", lang === "ar" ? "Switch to English" : "التبديل إلى العربية");
  render();
  ncLang();
  equalize();
  $("#demoClose").setAttribute("aria-label", lang === "ar" ? "إغلاق" : "Close");
  $("#formNote").hidden = true;
  try { localStorage.setItem("nayeb-lang", lang); } catch (e) {}
}

$("#langBtn").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; applyLang(); });
document.addEventListener("click", e => {
  const b = e.target.closest(".fchip");
  if (!b) return;
  const i = +b.dataset.ch, f = +b.dataset.f, box = $("#chb-" + i);
  sel[i] = f;
  box.querySelectorAll(".fchip").forEach((x,j) => x.setAttribute("aria-pressed", j === f));
  box.querySelectorAll(".stack").forEach(st => [...st.children].forEach((x,j) => {
    if (j === f) x.removeAttribute("aria-hidden"); else x.setAttribute("aria-hidden", "true");
  }));
  b.scrollIntoView({block:"nearest", inline:"nearest"});
  if (matchMedia("(max-width:699px)").matches) box.querySelector(".cards2").scrollIntoView({block:"nearest", behavior:"smooth"});
});
$("#demoForm").addEventListener("submit", e => {
  e.preventDefault();
  const ok = $("#fName").value.trim() && $("#fCo").value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("#fEmail").value.trim());
  const n = $("#formNote"); n.textContent = ok ? t("fm_ok") : t("fm_missing"); n.hidden = false;
});

/* demo pop-up */
const modal = $("#demoModal"), frame = $("#demoFrame");
let lastFocus = null;
function openDemo(){
  lastFocus = document.activeElement;
  if (!frame.src) frame.src = "demo.html";
  modal.hidden = false; document.body.classList.add("locked");
  $("#demoClose").focus();
}
function closeDemo(){
  modal.hidden = true; document.body.classList.remove("locked");
  if (lastFocus) lastFocus.focus();
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-demo]");
  if (a) { e.preventDefault(); openDemo(); }
});
$("#demoClose").addEventListener("click", closeDemo);
modal.addEventListener("click", e => { if (e.target === modal) closeDemo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeDemo(); });
$("#demoClose").setAttribute("aria-label", "Close");
applyLang();
